name: Prisvarsler (TV)

on:
  schedule:
    # Døgnet rundt – Black Friday-priser slippes gjerne ved midnatt.
    # GitHub struper planlagte kjøringer (i praksis hver 30.–60. min), så vi
    # lener oss ikke på cron alene: hver kjøring looper i inntil 50 minutter
    # og sjekker selv butikksidene hvert 5. minutt og Prisjakt hver time
    # (STORE_INTERVAL_MIN / PRISJAKT_INTERVAL_MIN). Samme grep som
    # billettvarsleren. Repoet er offentlig, så Actions-minuttene er gratis.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dump_html:
        description: "Skriv starten av sideinnholdet i loggen (feilsøking)"
        type: boolean
        default: false
      kun:
        description: "Feilsøk bare sider som inneholder denne teksten (f.eks. komplett). Lagrer ingenting og varsler ikke."
        type: string
        default: ""
      test_url:
        description: "Test én lenke før du legger den inn (ett besøk). Lagrer ingenting og varsler ikke."
        type: string
        default: ""

concurrency:
  # Feilsøkingskjøringer (kun=…) lagrer ingenting, og skal ikke vente bak
  # den vanlige loopen på 50 minutter.
  group: prisvarsler${{ (inputs.kun || inputs.test_url) && '-feilsok' || '' }}
  cancel-in-progress: false

jobs:
  sjekk-priser:
    runs-on: ubuntu-latest
    # Litt over looplengden, så en hengende kjøring ikke blokkerer neste.
    timeout-minutes: 58
    permissions:
      contents: write

    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sjekk priser og send varsler
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Minste prisfall i prosent som gir varsel. Kan overstyres med en
          # repository variable (Settings → Secrets and variables → Variables).
          MIN_DROP_PCT: ${{ vars.MIN_DROP_PCT || '1' }}
          STORE_INTERVAL_MIN: ${{ vars.STORE_INTERVAL_MIN || '5' }}
          PRISJAKT_INTERVAL_MIN: ${{ vars.PRISJAKT_INTERVAL_MIN || '60' }}
          # Én runde ved feilsøking, ellers loop i 50 minutter.
          MAX_MINUTES: ${{ (inputs.dump_html || inputs.kun || inputs.test_url) && '0' || '50' }}
          DUMP_HTML: ${{ (inputs.dump_html || inputs.kun || inputs.test_url) && '1' || '' }}
          URL_FILTER: ${{ inputs.kun }}
          TEST_URL: ${{ inputs.test_url }}
        run: python check_prices.py

      - name: Lagre tilstand og prislogg tilbake til repo
        if: always() && !inputs.kun && !inputs.test_url
        run: |
          [ -f data/tv_prices_state.json ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Samme mønster som de andre varslerne: bygg commiten rett oppå
          # nyeste main, og prøv på nytt hvis en parallell kjøring rakk å
          # pushe i mellomtiden. Prisloggen vokser bare i bunnen, så vi tar
          # vare på de nye radene og legger dem oppå nyeste main – da kan ikke
          # en parallell kjøring viske ut historikk.
          cp data/tv_prices_state.json /tmp/tv_prices_state.json.new
          git diff --no-color -U0 HEAD -- data/tv_price_log.csv | grep '^+[^+]' | cut -c2- > /tmp/new_log_rows.csv || true
          if ! git ls-files --error-unmatch data/tv_price_log.csv >/dev/null 2>&1 && [ -f data/tv_price_log.csv ]; then
            cp data/tv_price_log.csv /tmp/new_log_rows.csv   # første gang: hele fila
          fi

          success=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tv_prices_state.json.new data/tv_prices_state.json
            if [ -s /tmp/new_log_rows.csv ]; then
              if [ -s data/tv_price_log.csv ]; then
                grep -v '^tidspunkt,' /tmp/new_log_rows.csv >> data/tv_price_log.csv || true
              else
                cp /tmp/new_log_rows.csv data/tv_price_log.csv
              fi
            fi
            git add data/tv_prices_state.json
            if [ -f data/tv_price_log.csv ]; then git add data/tv_price_log.csv; fi
            if git diff --staged --quiet; then
              echo "Ingen endringer å lagre."
              success=true
              break
            fi
            git commit -m "chore: oppdater TV-priser [skip ci]"
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Push feilet (forsøk $attempt/5), prøver på nytt..."
            sleep $((attempt * 2))
          done

          if [ "$success" != true ]; then
            echo "::error::Klarte ikke å pushe TV-prisene etter 5 forsøk."
            exit 1
          fi

      - name: Varsle hvis kjøringen feilet
        if: failure() && !inputs.kun && !inputs.test_url
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC ikke satt – kan ikke varsle om feilen."
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -X POST "https://ntfy.sh/$NTFY_TOPIC" \
            -H "Title: Prisvarsleren feilet" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "Klarte ikke å lese en eneste TV-pris. Sjekk loggen:

          $RUN_URL" || true
