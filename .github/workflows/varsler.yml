name: Vinmonopolet Varsler
 
on:
  schedule:
    - cron: "*/5 6-19 * * *"
  workflow_dispatch:
 
jobs:
  sjekk-produkter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
 
      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      # MIDLERTIDIG: kjører diagnoseskript i stedet for check_products.py
      # for å feilsøke brand-nøkkel-problemet for Elise Bougy. Reverteres
      # etter feilsøking – sender ingen varsler, endrer ikke state.json.
      - name: Sjekk produkter og send varsler
        env:
          VINMONOPOLET_API_KEY: ${{ secrets.VINMONOPOLET_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python diagnose_brand.py
