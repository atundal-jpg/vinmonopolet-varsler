name: Vinmonopolet Varsler
 
on:
  schedule:
    - cron: "*/5 6-19 * * *"
  workflow_dispatch:
 
jobs:
  sjekk-produkter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
 
      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Sjekk produkter og send varsler
        env:
          VINMONOPOLET_API_KEY: ${{ secrets.VINMONOPOLET_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python check_products.py
 
      - name: Lagre tilstand (state.json) tilbake til repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: oppdater tilstand [skip ci]"
          git push
