name: Vinmonopolet Varsler
 
on:
  schedule:
    - cron: "*/5 6-19 * * *"
  workflow_dispatch:

concurrency:
  group: vinmonopolet-varsler
  cancel-in-progress: false

jobs:
  sjekk-produkter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
 
      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Sjekk produkter og send varsler
        env:
          VINMONOPOLET_API_KEY: ${{ secrets.VINMONOPOLET_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python check_products.py
 
      - name: Lagre tilstand (state.json) tilbake til repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ta vare på den ferskt beregnede state.json før den evt. blir
          # overskrevet av et reset lenger ned.
          cp data/state.json /tmp/state.json.new

          # I stedet for å pulle/rebase en commit inn i historikken (som
          # kolliderer hvis en annen kjøring har rukket å pushe i mellomtiden),
          # bygger vi alltid en ny commit rett oppå den nyeste main. Ved
          # push-feil (racing kjøring eller forbigående GitHub-feil) hentes
          # nyeste main på nytt og forsøket gjentas.
          success=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json.new data/state.json
            git add data/state.json
            if git diff --staged --quiet; then
              echo "Ingen endringer i state.json å lagre."
              success=true
              break
            fi
            git commit -m "chore: oppdater tilstand [skip ci]"
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Push feilet (forsøk $attempt/5), prøver på nytt..."
            sleep $((attempt * 2))
          done

          if [ "$success" != true ]; then
            echo "::error::Klarte ikke å pushe state.json etter 5 forsøk."
            exit 1
          fi
